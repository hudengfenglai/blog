########################################
# Comment system - Waline
########################################
comment:
  title:
    zh-CN: 说些什么吧！
  default: waline

waline:
  enable: true
  serverURL: ""  # ⚠️ 请填写你的 Waline 服务地址，如 https://你的域名.vercel.app
  locale:
    zh-CN:
      nick: 昵称
      nickError: "昵称不能为空"
      mail: 邮箱
      mailError: "请填写正确的邮箱地址"
      link: 网站
      placeholder: "想说点什么..."
      submit: 提交
      replies: "回复"
      reply: 回复
      cancel: 取消
      confirm: 确认
      loading: 加载中...
      noComment: 还没有评论哦，快来抢沙发吧！
      error: 加载失败，请重试！
  emoji:
    - https://unpkg.com/@waline/emojis@1.2.0/weibo
    - https://unpkg.com/@waline/emojis@1.2.0/alus
    - https://unpkg.com/@waline/emojis@1.2.0/bilibili
    - https://unpkg.com/@waline/emojis@1.2.0/qq
    - https://unpkg.com/@waline/emojis@1.2.0/tieba
    - https://unpkg.com/@waline/emojis@1.2.0/tw-emoji
  meta:
    - nick
    - mail
    - link
  requiredMeta:
    - nick
    - mail
  wordLimit: 500
  pageSize: 10
  pageview: true

########################################
# Statistics - 不蒜子
########################################
footer:
  since: 2024
  powered: true
  count: true
  busuanzi: true

########################################
# Social Links
########################################
social:
  github: https://github.com/hudengfenglai
  bilibili: https://space.bilibili.com/
  email: mailto:hello@example.com

########################################
# Search - Algolia
########################################
algolia_search:
  enable: true
  appID: ""      # ⚠️ 请填写你的 Algolia App ID
  apiKey: ""     # ⚠️ 请填写你的 Algolia Search-Only Key
  indexName: ""  # ⚠️ 请填写你的 Algolia Index Name

########################################
# Code Block Settings
########################################
code_block:
  expand: true

clipboard:
  success:
    zh-CN: 复制成功 (*^▽^*)
  fail:
    zh-CN: 复制失败 (ﾟ⊿ﾟ)ﾂ
  copyright:
    enable: false
    count: 50
    license_type: by-nc-sa

########################################
# Article Copyright
########################################
article_copyright:
  enable: false
  content:
    author: true
    link: true
    title: false
    date: false
    updated: false
    license: true
    license_type: by-nc-sa

########################################
# Math & Diagrams
########################################
math:
  katex:
    enable: true

mermaid:
  zoom: true

########################################
# Animation & Effects
########################################
animation:
  enable: true
  options:
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up
    archive:
      whole: fade-up
      tag: zoom-in
      category: zoom-in
      section: fade-up
      nav: fade-up

firework:
  enable: true
  disable_on_mobile: false
  options:
    excludeElements: ["a", "button"]
    particles:
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)", "var(--red-4)"]
        number: 20
        duration: [1200, 1800]
        shapeOptions:
          radius: [16, 32]
          alpha: [0.3, 0.5]
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions:
          radius: 20
          alpha: [0.2, 0.5]
          lineWidth: 6

########################################
# Pangu.js - 自动空格
########################################
pangu:
  enable: false

########################################
# Live2D (实验性)
########################################
live2d:
  enable: false
  position: left

########################################
# Sponsor
########################################
sponsor:
  enable: false
  tip:
    zh-CN: 请作者喝杯咖啡吧
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true

########################################
# Injector - 自定义代码注入
########################################
injector:
  head_end: |
    <style>
      /* ==================== 全局增强样式 ==================== */

      /* 文章卡片悬浮效果增强 */
      .post-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .post-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(231, 76, 60, 0.15);
      }

      /* 分类卡片样式 */
      .home-categories-card {
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .home-categories-card:hover {
        transform: scale(1.03);
        box-shadow: 0 15px 35px rgba(231, 76, 60, 0.2);
      }

      /* 文章标题渐变 */
      .article header h1 {
        font-size: 2.2em;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, var(--red-0), var(--red-1));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* 标签样式增强 */
      .tag {
        display: inline-block;
        padding: 0.25em 0.7em;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--red-4), var(--red-5));
        color: var(--red-1);
        font-size: 0.8rem;
        transition: all 0.3s ease;
      }

      .tag:hover {
        background: linear-gradient(135deg, var(--red-3), var(--red-4));
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
      }

      /* 友链卡片增强 */
      .friend-card {
        border-radius: 16px;
        padding: 1.5rem;
        background: var(--color-wrap);
        border: 1px solid var(--color-border);
        transition: all 0.3s ease;
      }

      .friend-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(231, 76, 60, 0.15);
        border-color: var(--red-3);
      }

      /* 归档年份样式 */
      .archive-year {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--red-1);
        margin-bottom: 1rem;
        position: relative;
        padding-left: 1rem;
      }

      .archive-year::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 70%;
        background: linear-gradient(to bottom, var(--red-0), var(--red-2));
        border-radius: 2px;
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--highlight-background);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--highlight-scrollbar);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--red-2);
      }

      /* 暗色模式适配 */
      [data-theme="dark"] .tag {
        background: linear-gradient(135deg, var(--red-5), var(--red-5-5));
        color: var(--red-3);
      }

      [data-theme="dark"] .tag:hover {
        background: linear-gradient(135deg, var(--red-4), var(--red-5));
      }

      [data-theme="dark"] .post-card:hover {
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      /* 响应式优化 */
      @media (max-width: 768px) {
        .article header h1 {
          font-size: 1.6em;
        }

        .post-card:hover {
          transform: translateY(-4px);
        }

        .home-categories-card:hover {
          transform: scale(1.01);
        }
      }
    </style>

